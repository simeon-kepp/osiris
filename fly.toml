app = "dingir-osint"
primary_region = "fra"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # This is the public-facing entrypoint -- checked, 2026-08-17: it had no
  # active health check at all (fly checks list returned empty), unlike
  # dingir-bi-api which got one the same day. A hung Next.js process would
  # sit "started" but unresponsive with nothing noticing or restarting it;
  # auto_start_machines only helps a STOPPED machine, not a started-but-
  # wedged one. /api/health already existed, unused for this.
  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "get"
    path = "/api/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
